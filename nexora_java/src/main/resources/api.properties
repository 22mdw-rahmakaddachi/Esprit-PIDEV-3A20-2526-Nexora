# Configuration API Konnect
konnect.api.url=https://api.konnect.network/api/v2/payments/init-payment
konnect.api.key=VOTRE_CLE_API_KONNECT
konnect.wallet.id=VOTRE_WALLET_ID
konnect.mode.test=true
konnect.timeout.seconds=30

# Configuration Chatbot
chatbot.max.results=5
chatbot.response.delay.ms=500
chatbot.budget.extraction.enabled=true
chatbot.category.search.enabled=true
chatbot.promo.search.enabled=true

# Configuration HTTP Client
http.connection.timeout=10000
http.socket.timeout=30000
http.max.connections=20
http.user.agent=NEXORA-Ecommerce/1.0

# Configuration Logging
logging.level.api=INFO
logging.level.chatbot=DEBUG
logging.level.payment=INFO